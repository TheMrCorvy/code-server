# =============================================================================
# docker-compose.yml  —  code-server homelab deployment
# =============================================================================
# Usage:
#   cp .env.example .env        # edit at minimum: TZ
#   docker compose up -d
#   docker compose logs -f code-server
# =============================================================================

services:
  code-server:
    # -------------------------------------------------------------------------
    # Image
    # -------------------------------------------------------------------------
    # Uses the official upstream image directly — no custom build needed.
    # This saves ~1–1.5 GB of disk and eliminates build time entirely.
    # entrypoint.sh and settings.json are mounted as volumes below.
    image: ghcr.io/coder/code-server:${CODE_SERVER_VERSION:-4.102.1}

    # Option B: build the custom image (adds Node.js LTS, PHP 8, Composer).
    # Use this if you need those runtimes available in the IDE terminal.
    # Switch to this by uncommenting the block below and commenting out
    # the `image:` line above.
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    #   args:
    #     CODE_SERVER_VERSION: ${CODE_SERVER_VERSION:-4.102.1}
    # image: homelab/code-server:${CODE_SERVER_VERSION:-4.102.1}

    container_name: code-server
    restart: unless-stopped

    # Run as root so code-server can read and write any file on the host.
    # This is safe because the instance is behind Pangolin SSO and
    # localhost-only — it is not directly exposed to the internet.
    user: root

    # Override the default entrypoint with our bootstrap script.
    # This is what installs Copilot and seeds settings on first run.
    entrypoint: ["/bin/bash", "/usr/local/bin/entrypoint.sh"]

    # -------------------------------------------------------------------------
    # Port mapping
    # -------------------------------------------------------------------------
    # Binds ONLY to localhost — Pangolin connects here and proxies to the world.
    # Do NOT change 127.0.0.1 to 0.0.0.0 unless you have another firewall layer.
    ports:
      - "127.0.0.1:8080:8080"

    # -------------------------------------------------------------------------
    # Environment variables
    # -------------------------------------------------------------------------
    environment:
      # Authentication mode.
      # 'none'     → no login screen (safe when Pangolin SSO is in front)
      # 'password' → enable built-in password prompt (set PASSWORD below too)
      - AUTH=${AUTH:-none}

      # Only used when AUTH=password
      # - PASSWORD=${PASSWORD}
      # - HASHED_PASSWORD=${HASHED_PASSWORD}

      # Public domain assigned by Pangolin (e.g. code.yourdomain.com).
      - PROXY_DOMAIN=${PROXY_DOMAIN:-}

      # Default workspace — derived from SSH_USER so you only set your username once.
      # Maps to ~/Desktop/www on the Mac Mini host via the /:/host volume mount.
      - DEFAULT_WORKSPACE=/host/Users/${SSH_USER}/Desktop/www

      # Container timezone
      - TZ=${TZ:-UTC}

      # -----------------------------------------------------------------------
      # SSH → Host configuration
      # -----------------------------------------------------------------------
      # Username on the real host machine (macOS or Ubuntu).
      - SSH_USER=${SSH_USER:-}

      # Hostname the container uses to reach the real host machine.
      # host.docker.internal resolves to the host on both OrbStack and Linux
      # (Linux requires the extra_hosts entry below — already included).
      # OrbStack users can alternatively use host.orb.internal.
      - SSH_HOST=${SSH_HOST:-host.docker.internal}

      # SSH port on the host machine (almost always 22).
      - SSH_PORT=${SSH_PORT:-22}

    # -------------------------------------------------------------------------
    # Volumes
    # -------------------------------------------------------------------------
    volumes:
      # code-server user data: settings, extensions, keybindings…
      - ${DATA_DIR:-./data}/config:/home/coder/.local/share/code-server

      # Host filesystem — the entire server is accessible under /host.
      # Use File > Open Folder and navigate to /host to reach any server path.
      # Example: /host/home/youruser/projects/my-app
      - /:/host

      # Bootstrap scripts and config — mounted read-only into the container.
      - ./scripts/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - ./scripts/ssh-to-host.sh:/usr/local/bin/ssh-to-host:ro
      - ./config/settings.json:/etc/code-server/default-settings.json:ro

      # Docker socket — lets you run `docker` commands from the IDE terminal.
      # PERMISSION NOTE: running as root already grants socket access,
      # so DOCKER_GID and group_add are not needed.
      - /var/run/docker.sock:/var/run/docker.sock

      # SSH private key for host access.
      # Generate a dedicated key pair — see docs/ssh-setup-guide.md.
      # The public key must be added to ~/.ssh/authorized_keys on the host.
      - ./secrets/ssh_host_key:/home/coder/.ssh/id_ed25519:ro

    # Uncomment and set DOCKER_GID in .env to grant the coder user Docker access:
    # group_add:
    #   - "${DOCKER_GID}"

    # All three anchors (working_dir, DEFAULT_WORKSPACE, code-server open folder)
    # point at the same place: ~/Desktop/www on the Mac Mini host.
    working_dir: /host/Users/${SSH_USER}/Desktop/www

    # -------------------------------------------------------------------------
    # Resource limits
    # -------------------------------------------------------------------------
    deploy:
      resources:
        limits:
          # Hard ceiling — code-server will be OOM-killed if it exceeds this.
          # 1.5 cores and 1.5G is comfortable for active editing with extensions.
          # Drop to 1.0 / 1G if the server is very constrained.
          cpus: "1.5"
          memory: 1.5G
        reservations:
          # What Docker's scheduler pre-allocates for this container.
          # Keep this low so other workloads on the same host aren't starved
          # while code-server is idle (which is most of the time).
          cpus: "0.1"
          memory: 256M

    # -------------------------------------------------------------------------
    # Health check
    # -------------------------------------------------------------------------
    # start_period is long to allow time for first-run extension installation.
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

    # -------------------------------------------------------------------------
    # Logging
    # -------------------------------------------------------------------------
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # -------------------------------------------------------------------------
    # Security
    # -------------------------------------------------------------------------
    security_opt:
      - no-new-privileges:true

    # -------------------------------------------------------------------------
    # Host resolution (Linux Docker compatibility)
    # -------------------------------------------------------------------------
    # Makes host.docker.internal resolve to the real host machine on Linux.
    # On macOS (OrbStack / Docker Desktop) this is automatic; harmless there.
    extra_hosts:
      - "host.docker.internal:host-gateway"
