# =============================================================================
# k8s/ingress.yaml  —  Ingress for code-server (optional)
# =============================================================================
# Requires an Ingress controller (e.g., ingress-nginx, Traefik) and
# cert-manager for automatic TLS certificates.
#
# Replace `code.yourdomain.com` with your actual domain before applying.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: code-server
  namespace: code-server
  labels:
    app.kubernetes.io/name: code-server
  annotations:
    # --- ingress-nginx ---
    kubernetes.io/ingress.class: "nginx"
    # WebSocket support is REQUIRED for code-server to function correctly
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/server-snippets: |
      location / {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
      }
    # --- cert-manager TLS (comment out if not using cert-manager) ---
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  # TLS — remove this block if you are terminating TLS at Pangolin instead
  tls:
    - hosts:
        - code.yourdomain.com   # ← replace with your domain
      secretName: code-server-tls

  rules:
    - host: code.yourdomain.com   # ← replace with your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: code-server
                port:
                  name: http
