# =============================================================================
# k8s/secret.yaml  —  code-server credentials
# =============================================================================
# IMPORTANT: Do NOT commit real credentials to version control.
# This file shows the structure. Before applying:
#
#   kubectl create secret generic code-server-secret \
#     --from-literal=PASSWORD='your_strong_password' \
#     --namespace code-server \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Or use a Sealed Secret / External Secrets Operator for GitOps workflows.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: code-server-secret
  namespace: code-server
  labels:
    app.kubernetes.io/name: code-server
type: Opaque
stringData:
  # Replace with your actual password before applying
  PASSWORD: "changeme_use_a_strong_password"
